# .github/workflows/build.yml
name: Build

on:
  workflow_call:
    inputs:
      variant:
        type: string
        default: headless
        description: headless or webui; each publishes its own Release
      version:
        type: string
        required: false
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate
      prerelease:
        type: boolean
        description: "Identify the release as a prerelease. Defaults to false"
        required: false

  workflow_dispatch:
    inputs:
      variant:
        type: choice
        default: headless
        options: [headless, webui]
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate


permissions:
  contents: write

jobs:
  build:
    name: build ${{ inputs.variant }} ${{ matrix.target }} ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          # - target: x86_64-pc-windows-gnu
          #   os: windows-latest
          #   archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: i686-pc-windows-msvc
            os: windows-latest
            archive: zip
          # - target: i686-pc-windows-gnu  # error: linker `i686-w64-mingw32-gcc` not found
          #   os: windows-latest
          #   archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: arch64-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: mips-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          # - target: mips-unknown-linux-musl
          #   archive: tar.gz tar.xz tar.zst
          # - target: mips64-unknown-linux-muslabi64
          #   archive: tar.gz tar.xz tar.zst
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz tar.xz tar.zst
          # - target: x86_64-unknown-freebsd
          #   os: ubuntu-latest
          #   archive: tar.gz tar.xz tar.zst
          # - target: x86_64-unknown-netbsd
          #   os: ubuntu-latest
          #   archive: tar.gz tar.xz tar.zst
          # - target: wasm32-unknown-emscripten
          #   archive: tar.gz tar.xz tar.zst

    runs-on: ${{matrix.os}}
    env:
      BUILD_FEATURES: ${{ format('{0}{1}', inputs.features, inputs.variant == 'webui' && ',webui' || '') }}
      SMARTDNS_RELEASE_REPOSITORY: ${{ github.repository }}
      BUILD_VARIANT: ${{ inputs.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}

      - name: Validate variant and capture source revision
        id: source
        shell: bash
        run: |
          case "$BUILD_VARIANT" in headless|webui) ;; *) exit 1 ;; esac
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: just build --release --no-default-features --features "$BUILD_FEATURES" --target=${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Package
        run: just flavor=${{ inputs.variant }} target=${{ matrix.target }} pack
        shell: bash

      - name: Compute release label
        id: release_label
        uses: ./.github/actions/sanitize-label
        with:
          raw_label: ${{ inputs.version || github.ref_name }}
          fallback_sha: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: smartdns-${{ inputs.variant }}-${{ matrix.target }}-${{ steps.release_label.outputs.value }}
          retention-days: 30
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2.3.2
        if: ${{ startsWith(inputs.version, 'v') }}
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          tag_name: ${{ inputs.variant == 'webui' && format('webui-{0}', inputs.version) || inputs.version }}
          name: SmartDNS-rs ${{ inputs.variant }} ${{ inputs.version }}
          make_latest: ${{ inputs.variant == 'headless' && !inputs.prerelease }}
          target_commitish: ${{ steps.source.outputs.sha }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
