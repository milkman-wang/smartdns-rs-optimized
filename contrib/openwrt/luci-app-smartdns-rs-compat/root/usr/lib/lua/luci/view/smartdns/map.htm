<link rel="stylesheet" href="<%=resource%>/smartdns/form.css?v=25.7" />
<% if self.smartdns_check then %>
<div class="alert-message <%=self.smartdns_check.valid and 'notice' or 'warning'%>" role="status">
	<p style="margin:0;color:inherit"><%=pcdata(self.smartdns_check.message)%></p>
	<% if #self.smartdns_check.output > 0 then %>
	<pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:inherit;background:transparent"><%=pcdata(self.smartdns_check.output)%></pre>
	<% end %>
</div>
<% end %>
<%+cbi/map%>
